<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-label="persona chat example">
  <rect width="360" height="640" rx="18" fill="#0b141a"/>

  <!-- header -->
  <rect width="360" height="56" rx="18" fill="#202c33"/>
  <rect y="38" width="360" height="18" fill="#202c33"/>
  <path d="M 20 28 l 10 -8 l -10 -8" stroke="#aebac1" stroke-width="2" fill="none"/>
  <circle cx="52" cy="28" r="14" fill="#6a7175"/>
  <text x="52" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b141a">C</text>
  <text x="76" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e9edef">Capri</text>
  <text x="76" y="41" font-family="sans-serif" font-size="11" fill="#8696a0">online</text>
  <text x="340" y="33" text-anchor="end" font-family="sans-serif" font-size="14" fill="#aebac1">&#8942;</text>

  <!-- date pill -->
  <rect x="140" y="70" width="80" height="20" rx="9" fill="#182229"/>
  <text x="180" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8696a0">TODAY</text>

  <!-- in: hey capri -->
  <rect x="14" y="102" width="94" height="38" rx="10" fill="#202c33"/>
  <text x="26" y="125" font-family="sans-serif" font-size="13" fill="#e9edef">hey capri</text>

  <!-- out: reply -->
  <rect x="120" y="152" width="226" height="60" rx="10" fill="#005c4b"/>
  <text x="132" y="172" font-family="sans-serif" font-size="13" fill="#e9edef">hey, the chip's been humming</text>
  <text x="132" y="190" font-family="sans-serif" font-size="13" fill="#e9edef">all day. what chaos are we</text>
  <text x="132" y="205" font-family="sans-serif" font-size="13" fill="#e9edef">cooking up? <tspan fill="#8696a0" font-size="10">09:41 &#10003;&#10003;</tspan></text>

  <!-- in: rank up -->
  <rect x="14" y="224" width="196" height="38" rx="10" fill="#202c33"/>
  <text x="26" y="247" font-family="sans-serif" font-size="13" fill="#e9edef">just hit master rank in apex</text>

  <!-- out: rating -->
  <rect x="90" y="274" width="256" height="78" rx="10" fill="#005c4b"/>
  <text x="102" y="294" font-family="sans-serif" font-size="13" fill="#e9edef">the getaway driver approves.</text>
  <text x="102" y="312" font-family="sans-serif" font-size="13" fill="#e9edef">climb rated 8/10 &#8212; points off for</text>
  <text x="102" y="330" font-family="sans-serif" font-size="13" fill="#e9edef">the excuses after losses.</text>
  <text x="102" y="345" font-family="sans-serif" font-size="13" fill="#e9edef">next: rematch or a dumb dare? <tspan fill="#8696a0" font-size="10">09:41 &#10003;&#10003;</tspan></text>

  <!-- in: dare -->
  <rect x="14" y="364" width="150" height="38" rx="10" fill="#202c33"/>
  <text x="26" y="387" font-family="sans-serif" font-size="13" fill="#e9edef">dumb dare obviously</text>

  <!-- out: dare -->
  <rect x="120" y="414" width="226" height="60" rx="10" fill="#005c4b"/>
  <text x="132" y="434" font-family="sans-serif" font-size="13" fill="#e9edef">that's my crew. steal a kill with</text>
  <text x="132" y="452" font-family="sans-serif" font-size="13" fill="#e9edef">a melee finish and i'll rate the</text>
  <text x="132" y="467" font-family="sans-serif" font-size="13" fill="#e9edef">chaos out of ten. <tspan fill="#8696a0" font-size="10">09:42 &#10003;&#10003;</tspan></text>

  <!-- input bar -->
  <rect y="576" width="360" height="64" fill="#202c33"/>
  <rect x="14" y="592" width="280" height="32" rx="16" fill="#2a3942"/>
  <text x="30" y="613" font-family="sans-serif" font-size="13" fill="#8696a0">Message</text>
  <circle cx="330" cy="608" r="18" fill="#00a884"/>
  <path d="M 330 600 v 12 M 326 608 l 4 4 l 4 -4" stroke="#0b141a" stroke-width="2" fill="none"/>
</svg>
