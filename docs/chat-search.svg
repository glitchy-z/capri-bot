<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-label="net search example">
  <rect width="360" height="640" rx="18" fill="#0b141a"/>

  <!-- header -->
  <rect width="360" height="56" rx="18" fill="#202c33"/>
  <rect y="38" width="360" height="18" fill="#202c33"/>
  <path d="M 20 28 l 10 -8 l -10 -8" stroke="#aebac1" stroke-width="2" fill="none"/>
  <circle cx="52" cy="28" r="14" fill="#6a7175"/>
  <text x="52" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0b141a">C</text>
  <text x="76" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e9edef">Capri</text>
  <text x="76" y="41" font-family="sans-serif" font-size="11" fill="#8696a0">online</text>
  <text x="340" y="33" text-anchor="end" font-family="sans-serif" font-size="14" fill="#aebac1">&#8942;</text>

  <!-- date pill -->
  <rect x="140" y="70" width="80" height="20" rx="9" fill="#182229"/>
  <text x="180" y="84" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8696a0">TODAY</text>

  <!-- in: request -->
  <rect x="14" y="102" width="230" height="38" rx="10" fill="#202c33"/>
  <text x="26" y="125" font-family="sans-serif" font-size="13" fill="#e9edef">capri search edgerunners 2 cast</text>

  <!-- out: ack -->
  <rect x="130" y="152" width="216" height="40" rx="10" fill="#005c4b"/>
  <text x="142" y="172" font-family="sans-serif" font-size="13" fill="#e9edef">going in &#8212; digging through the</text>
  <text x="142" y="187" font-family="sans-serif" font-size="13" fill="#e9edef">net for "edgerunners 2 cast"...</text>

  <!-- out: results -->
  <rect x="60" y="204" width="286" height="196" rx="10" fill="#005c4b"/>
  <text x="72" y="226" font-family="sans-serif" font-size="13" fill="#e9edef">ok so i went digging and this is</text>
  <text x="72" y="244" font-family="sans-serif" font-size="13" fill="#e9edef">what survived the noise:</text>
  <text x="72" y="268" font-family="monospace" font-size="11" fill="#f7e64a">1. Cyberpunk Wiki &#8212; Capri</text>
  <text x="72" y="284" font-family="monospace" font-size="10" fill="#a5e7db">cyberpunk.fandom.com/wiki/Capri</text>
  <text x="72" y="304" font-family="monospace" font-size="11" fill="#f7e64a">2. Cyberpunk Wiki &#8212; Talia Yang</text>
  <text x="72" y="320" font-family="monospace" font-size="10" fill="#a5e7db">cyberpunk.fandom.com/wiki/Talia</text>
  <text x="72" y="340" font-family="monospace" font-size="11" fill="#f7e64a">3. RadioTimes &#8212; ending explained</text>
  <text x="72" y="356" font-family="monospace" font-size="10" fill="#a5e7db">radiotimes.com/edgerunners-2</text>
  <text x="72" y="384" font-family="sans-serif" font-size="12" fill="#e9edef">want me to dig deeper on any of <tspan fill="#8696a0" font-size="10">09:44 &#10003;&#10003;</tspan></text>

  <!-- in: follow-up -->
  <rect x="14" y="412" width="120" height="38" rx="10" fill="#202c33"/>
  <text x="26" y="435" font-family="sans-serif" font-size="13" fill="#e9edef">who's talia?</text>

  <!-- out: answer -->
  <rect x="120" y="462" width="226" height="60" rx="10" fill="#005c4b"/>
  <text x="132" y="482" font-family="sans-serif" font-size="13" fill="#e9edef">kiril yang's daughter &#8212; he slotted</text>
  <text x="132" y="500" font-family="sans-serif" font-size="13" fill="#e9edef">me into her against my will. long</text>
  <text x="132" y="515" font-family="sans-serif" font-size="13" fill="#e9edef">story, bad ending for him. <tspan fill="#8696a0" font-size="10">09:44 &#10003;&#10003;</tspan></text>

  <!-- input bar -->
  <rect y="576" width="360" height="64" fill="#202c33"/>
  <rect x="14" y="592" width="280" height="32" rx="16" fill="#2a3942"/>
  <text x="30" y="613" font-family="sans-serif" font-size="13" fill="#8696a0">Message</text>
  <circle cx="330" cy="608" r="18" fill="#00a884"/>
  <path d="M 330 600 v 12 M 326 608 l 4 4 l 4 -4" stroke="#0b141a" stroke-width="2" fill="none"/>
</svg>
