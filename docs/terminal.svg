<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-label="how to build — terminal">
  <!-- window -->
  <rect width="720" height="430" rx="10" fill="#0d1117" stroke="#2a313a" stroke-width="1"/>
  <rect width="720" height="30" rx="10" fill="#161b22"/>
  <rect y="20" width="720" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="6" fill="#febc2e"/>
  <circle cx="58" cy="15" r="6" fill="#28c840"/>
  <text x="360" y="19" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8b949e">capri-bot — bash</text>

  <!-- commands -->
  <text x="18" y="58" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> git clone https://github.com/glitchy-z/capri-bot.git</text>
  <text x="18" y="78" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">Cloning into 'capri-bot'... done.</text>
  <text x="18" y="102" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> cd capri-bot &amp;&amp; npm install</text>
  <text x="18" y="122" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">added 61 packages in 9s</text>
  <text x="18" y="146" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> cp config.example.json config.json   <tspan fill="#8b949e"># add your llm keys</tspan></text>
  <text x="18" y="170" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> npm start</text>

  <!-- qr frame -->
  <text x="360" y="202" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">=== SCAN THIS QR WITH WHATSAPP ===</text>
  <rect x="300" y="216" width="120" height="120" fill="#e6edf3" rx="4"/>
  <g fill="#0d1117">
    <rect x="308" y="224" width="30" height="30"/>
    <rect x="382" y="224" width="30" height="30"/>
    <rect x="308" y="298" width="30" height="30"/>
  </g>
  <g fill="#0d1117">
    <rect x="346" y="230" width="8" height="8"/><rect x="362" y="230" width="8" height="8"/><rect x="346" y="246" width="8" height="8"/>
    <rect x="378" y="262" width="8" height="8"/><rect x="394" y="278" width="8" height="8"/><rect x="362" y="270" width="8" height="8"/>
    <rect x="330" y="262" width="8" height="8"/><rect x="314" y="286" width="8" height="8"/><rect x="346" y="294" width="8" height="8"/>
    <rect x="378" y="306" width="8" height="8"/><rect x="394" y="322" width="8" height="8"/><rect x="346" y="322" width="8" height="8"/>
    <rect x="362" y="306" width="8" height="8"/><rect x="314" y="322" width="8" height="8"/><rect x="330" y="306" width="8" height="8"/>
    <rect x="354" y="322" width="8" height="8"/><rect x="394" y="230" width="8" height="8"/><rect x="322" y="238" width="8" height="8"/>
  </g>
  <rect x="316" y="232" width="14" height="14" fill="none" stroke="#0d1117" stroke-width="3"/>
  <rect x="390" y="232" width="14" height="14" fill="none" stroke="#0d1117" stroke-width="3"/>
  <rect x="316" y="306" width="14" height="14" fill="none" stroke="#0d1117" stroke-width="3"/>

  <!-- connected -->
  <text x="18" y="366" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7ee787">[10:11:24] capri-bot: awake on your number</text>
  <text x="18" y="386" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">public mode: ON (toggle with !public on/off)</text>
  <text x="18" y="410" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> <tspan fill="#7ee787">█</tspan></text>
</svg>
